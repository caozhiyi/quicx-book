    - "2. 拷贝的艺术: 零拷贝 Buffer 的生存哲学": 01_infrastructure/02_zero_copy_buffer.md
    - "3. 管道与枢纽: 网络 IO 的架构抽象": 01_infrastructure/03_network_io_abstraction.md
    - "4. 打破全局锁: One-Loop-Per-Thread 的无锁演进": 01_infrastructure/04_thread_model_and_lockfree.md
